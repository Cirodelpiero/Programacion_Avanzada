<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <title>Detalle Disco</title>

</head>

<body class="bg-dark text-white">

<div class="container mt-5">

    <div class="card mx-auto shadow-lg" style="width: 28rem;">

        <img 
        src="{{ url_for('static', filename='img/' + disco.imagen_principal) }}"
        class="card-img-top"
        alt="Disco">

        <div class="card-body">

            <h2 class="card-title">
                {{ disco.nombre }}
            </h2>

            <p class="card-text">
                <strong>Banda:</strong> {{ disco.banda }}
            </p>

            <p class="card-text">
                <strong>Año:</strong> {{ disco.anio }}
            </p>

            <p class="card-text">
                <strong>Precio:</strong> ${{ disco.precio }}
            </p>

            <p class="card-text">
                <strong>Stock:</strong> {{ disco.stock }}
            </p>

            <a href="/dashboard" class="btn btn-primary">
                Volver
            </a>

        </div>

    </div>

</div>

</body>
</html>

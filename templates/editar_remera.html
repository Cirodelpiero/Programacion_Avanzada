<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Editar Remera</title>

    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="fondo-formulario">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="formulario-card shadow-lg">

        <h1 class="text-center mb-4">
            Editar Remera
        </h1>

        <form
        method="POST"
        enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input
                type="text"
                name="nombre"
                value="{{ remera.nombre }}"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Precio
                </label>

                <input
                type="number"
                name="precio"
                value="{{ remera.precio }}"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>

                <input
                type="number"
                name="stock"
                value="{{ remera.stock }}"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Banda
                </label>

                <input
                type="text"
                name="banda"
                value="{{ remera.banda }}"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Talle
                </label>

                <input
                type="text"
                name="talle"
                value="{{ remera.talle }}"
                class="form-control input-formulario">

            </div>


            <div class="mb-3 text-center">

                <img
                src="{{ url_for('static', filename='img/' + remera.imagen_principal) }}"
                class="img-fluid rounded mb-3"
                width="200">

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Cambiar Imagen
                </label>

                <input
                type="file"
                name="imagen_principal"
                class="form-control input-formulario">

            </div>


            <div class="d-flex justify-content-between">

                <button
                type="submit"
                class="btn btn-success">

                    Guardar Cambios

                </button>


                <a
                href="/dashboard"
                class="btn btn-danger">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>

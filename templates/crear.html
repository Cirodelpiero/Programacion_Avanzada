<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Crear Disco</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="fondo-formulario">

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="formulario-card shadow-lg">

        <h1 class="text-center mb-4">
            Crear Disco
        </h1>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input
                type="text"
                name="nombre"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Precio
                </label>

                <input
                type="number"
                name="precio"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>

                <input
                type="number"
                name="stock"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Banda
                </label>

                <input
                type="text"
                name="banda"
                class="form-control input-formulario">

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Imagen Principal
                </label>

                <input
                type="file"
                name="imagen_principal"
                class="form-control input-formulario">

            </div>


            <div class="mb-4">

                <label class="form-label">
                    Año
                </label>

                <input
                type="number"
                name="anio"
                class="form-control input-formulario">

            </div>


            <div class="d-flex justify-content-between">

                <button
                type="submit"
                class="btn btn-success">

                    Aceptar

                </button>


                <a
                href="/dashboard"
                class="btn btn-danger">

                    Cancelar

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
